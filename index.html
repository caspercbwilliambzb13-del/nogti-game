function rebuild(){const zoom=phase==='paint'||phase==='lost'&&target>=0;const t=zoom?pose:overview;bg.save();bg.fillStyle=paper;bg.fillRect(0,0,W,H);if(photo.naturalWidth){bg.save();stageTransform(bg,t);if(zoom&&t.y>0)bg.drawImage(photo,0,0,1254,1,0,-t.y/t.s,1254,t.y/t.s+1);bg.drawImage(photo,0,0,1254,1254);done.forEach((color,i)=>{if(color!=null)varnish(bg,i,colors[color])});bg.restore()}
if(!zoom){bg.fillStyle=grad(bg,0,165,0,187,[[0,paper],[1,'#f4eee800']]);bg.fillRect(0,165,W,22);for(let i=0;i<4;i++)bottle(bg,i)}bg.restore();sync();requestDraw()}
function brush(c){const s=left?-1:1;const cr=cross();c.save();c.strokeStyle='#5d2a1a88';c.setLineDash([2,3]);c.beginPath();c.moveTo(tip.x+s*7,tip.y+1);c.lineTo(cr.x,cr.y);c.stroke();c.setLineDash([]);if(phase==='paint'){c.beginPath();c.arc(tip.x,tip.y,9.5,0,Math.PI*2);c.lineWidth=1;c.strokeStyle='#493c36a6';c.stroke()}c.translate(tip.x,tip.y);c.scale(s,1);c.rotate(-.49);const metal=grad(c,-7,0,7,0,[[0,'#514139'],[.13,'#d4b195'],[.36,'#fff2d4'],[.6,'#b7977e'],[1,'#41332e']]);c.fillStyle=metal;c.beginPath();c.roundRect(-7,-60,14,31,3);c.fill();c.fillStyle='#b99c8a';c.fillRect(-2,-29,4,18);c.fillStyle=selected<0?'#5f473f':colors[selected];c.fill(new Path2D('M-2 -13 Q-4 -10 -5 -2 Q0 2 5 -2 Q4 -10 2 -13 Z'));c.restore();if(phase==='wipe'){c.save();c.translate(tip.x,tip.y+1);c.fillStyle=colors[selected];const drop=new Path2D('M0 -2 C-1 3 -6 7 -6 11 C-6 19 6 19 6 11 C6 7 1 3 0 -2Z');c.strokeStyle='#fff0e3';c.lineWidth=1.5;c.stroke(drop);c.fill(drop);ellipse(c,-2,11,1.5,2.5,'#fff9');c.restore()}
ellipse(c,cr.x,cr.y,11.8,11.8,'#fff9f2');c.strokeStyle='#5d2a1a';c.lineWidth=1.5;c.stroke();c.beginPath();c.moveTo(cr.x-5,cr.y);c.lineTo(cr.x+5,cr.y);c.moveTo(cr.x,cr.y-5);c.lineTo(cr.x,cr.y+5);c.stroke()}
function draw(){const d=Math.min(2,window.devicePixelRatio||1);const width=Math.round(cvs.clientWidth*d),height=Math.round(width*H/W);if(cvs.width!==width||cvs.height!==height){cvs.width=width;cvs.height=height}ctx.setTransform(width/W,0,0,height/H,0,0);ctx.drawImage(scene,0,0,W,H);if((phase==='paint'||phase==='lost')&&target>=0)ctx.drawImage(paint,0,0,W,H);if(['dip','wipe','choose','paint','lost'].includes(phase))brush(ctx)}
function raster(path,t){const c=surface(MW,MH).getContext('2d',{willReadFrequently:true});c.scale(maskScale,maskScale);stageTransform(c,t);c.fill(path);return c.getImageData(0,0,MW,MH).data}
function startNail(i){target=i;const n=nails[i],s=i===3?1.68:1.48;pose={s,x:W/2-n.x*s,y:228-n.y*s};mask=raster(n.path,pose);skinMask=raster(handPath,pose);pixels=new Uint8Array(MW*MH);covered=0;total=0;coverage=0;for(let k=0;k<pixels.length;k++)if(mask[k*4+3]>=128)total++;ink.clearRect(0,0,MW,MH);phase='paint';notice='Возьмитесь за крестик ещё раз и начните со свободного края ногтя.';tip={x:W/2,y:68};release();rebuild()}
function alertBox(title,html,buttons){release();if(dialog.open)dialog.close();el('title').textContent=title;el('message').innerHTML=html;el('actions').replaceChildren();buttons.forEach(([label,fn],i)=>{const b=document.createElement('button');b.textContent=label;b.className='pill'+(i?' secondary':'');b.onclick=()=>{dialog.close();fn()};el('actions').append(b)});dialog.showModal()}
function reset(){done=[];used=[];nextColor()}
function nextColor(){phase='dip';selected=target=-1;tip={x:108,y:167};notice='';rebuild()}
function payout(n){phase='reward';notice='Результат этой игры — скидка '+n+'%.';rebuild();alertBox('Вы выиграли '+n+'%','<p>Готово ногтей — '+used.length+' из 4. В этой пробной версии результат виден только в игре.</p>',[['Сыграть ещё',reset]])}
function finishNail(){done[target]=selected;used.push(selected);target=-1;selected=-1;notice='';release();if(used.length===4){payout(10);return}if(used.length===2){phase='choice';rebuild();alertBox('У вас уже 5%','<p>Заберите скидку сейчас или покрасьте ещё два ногтя разными цветами. Если лак попадёт на кожу, попытка закончится без скидки.</p>',[['Забрать 5%',()=>payout(5)],['Играть за 10%',nextColor]]);return}nextColor()}
function lose(){phase='lost';notice='';rebuild();alertBox('Лак попал на кожу','<p>Попытка закончилась без скидки. В новой игре ведите кончик кисточки вдоль контура ногтя.</p>',[['Попробовать ещё',reset]])}
function dab(x,y){const r=5.1,cx=x*maskScale,cy=y*maskScale;let painted=false;const col=colors[selected];ink.fillStyle=col;for(let j=Math.max(0,Math.floor(cy-r));j<=Math.min(MH-1,Math.ceil(cy+r));j++){for(let i=Math.max(0,Math.floor(cx-r));i<=Math.min(MW-1,Math.ceil(cx+r));i++){const dist=(i+.5-cx)**2+(j+.5-cy)**2;if(dist>r*r)continue;const k=j*MW+i,a=k*4+3;if(mask[a]>=128){if(!pixels[k]){pixels[k]=1;covered++;painted=true;ink.fillRect(i,j,1,1)}}else if(skinMask[a]>180&&dist<(r-1.3)**2){lose();return}}}if(painted){coverage=covered/total;el('percent').textContent=Math.floor(coverage*100)+'%';if(coverage>=.98)finishNail()}}
function travel(x,y){const ox=tip.x,oy=tip.y,dx=x-ox,dy=y-oy,steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/2));for(let q=1;q<=steps;q++){tip={x:ox+dx*q/steps,y:oy+dy*q/steps};const p=tip;if(phase==='dip'){const i=bx.findIndex((v,i)=>!used.includes(i)&&Math.abs(p.x-v)<12&&Math.abs(p.y-neckY)<7);if(i>=0){selected=i;phase='wipe';notice='';sync();break}}
else if(phase==='wipe'){const delta=Math.abs(p.x-bx[selected]);if(delta>=12&&delta<=19&&Math.abs(p.y-neckY)<7){phase='choose';notice='';sync();break}if(p.y>=overview.y && bg.isPointInPath(handPath,(p.x-overview.x)/overview.s,(p.y-overview.y)/overview.s) && !nails.some(n=>bg.isPointInPath(n.path,(p.x-overview.x)/overview.s,(p.y-overview.y)/overview.s))){lose();return}if(p.y>145&&!notice){notice='На кисточке ещё капля. Вернитесь к горлышку и проведите по его боковому краю.';sync()}}
else if(phase==='choose'){const u=(p.x-overview.x)/overview.s,v=(p.y-overview.y)/overview.s;const nail=nails.findIndex(n=>bg.isPointInPath(n.path,u,v));if(nail>=0){if(done[nail]==null){startNail(nail);return}continue}if(bg.isPointInPath(handPath,u,v)){lose();return}}
else if(phase==='paint'){dab(p.x,p.y);if(phase!=='paint')return}}requestDraw()}
function release(){if(active!==null&&cvs.hasPointerCapture(active))cvs.releasePointerCapture(active);active=null;grab=null}
function point(e){const r=cvs.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function moveTip(x,y){const cr=cross(),sx=cr.x-tip.x,sy=cr.y-tip.y;travel(Math.min(W-5-Math.max(0,sx),Math.max(5-Math.min(0,sx),x)),Math.min(H-6-sy,Math.max(5,y)))}
cvs.onpointerdown=e=>{if(dialog.open||active!==null||!['dip','wipe','choose','paint'].includes(phase))return;const p=point(e),cr=cross();if(Math.hypot(p.x-cr.x,p.y-cr.y)*cvs.clientWidth/W>22){notice='Поставьте палец на круглый крестик рядом с кисточкой.';sync();return}active=e.pointerId;grab={x:p.x-tip.x,y:p.y-tip.y};cvs.setPointerCapture(active);notice='';sync();e.preventDefault()};
cvs.onpointermove=e=>{if(active===e.pointerId&&grab)moveTip(point(e).x-grab.x,point(e).y-grab.y)};cvs.onpointerup=cvs.onpointercancel=cvs.onlostpointercapture=e=>{if(active===e.pointerId)release()};
cvs.onkeydown=e=>{const dir={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(dir&&!dialog.open&&['dip','wipe','choose','paint'].includes(phase)){e.preventDefault();const step=e.shiftKey?2:6;moveTip(tip.x+dir[0]*step,tip.y+dir[1]*step)}};
el('side').onclick=()=>{release();left=!left;el('side').setAttribute('aria-pressed',String(left));el('side').textContent=left?'Для правши':'Для левши';requestDraw()};el('help').onclick=()=>alertBox('Как играть','<ul><li>Удерживайте крестик в стороне от кисточки. Подведите ворс к горлышку, затем сотрите каплю о край.</li><li>Подведите кисть к свободному ногтю со стороны его кончика. На увеличенном ногте снова возьмитесь за крестик и закрасьте всю поверхность.</li><li>Лак на коже заканчивает попытку. После двух цветов можно забрать 5%, после четырёх — 10%.</li></ul><p>С клавиатуры используйте стрелки. Shift уменьшает шаг.</p>',[['Понятно',()=>cvs.focus()]]);dialog.oncancel=e=>{if(['choice','lost','reward'].includes(phase))e.preventDefault()};window.addEventListener('blur',release);window.addEventListener('resize',()=>{release();requestDraw()});photo.onload=rebuild;reset();
</script></body></html>
