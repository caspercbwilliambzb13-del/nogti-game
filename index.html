<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Накрась ногти</title><style>
:root{color-scheme:light;--ink:#3A1E2B;--wine:#6D1F3C;--plum:#7A3B5D;--rose:#B76E79;--pale:#E8B4B8;--paper:#FDF7F5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}main{max-width:430px;margin:auto;padding:16px 16px 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font:400 27px/1.1 Georgia,serif;margin:0}.button{min-width:44px;min-height:44px;border:1px solid var(--wine);border-radius:999px;padding:0 16px;color:var(--wine);background:transparent;font:600 14px system-ui;cursor:pointer}.button:focus-visible,canvas:focus-visible{outline:3px solid var(--plum);outline-offset:3px}.status{display:flex;justify-content:space-between;gap:8px;margin-top:16px;font-size:13px}.status strong{color:var(--wine)}.meter{height:5px;background:#eadbd9;border-radius:8px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;width:0;background:var(--wine)}.instruction{min-height:60px;margin:12px 0 4px}.instruction strong{display:block;color:var(--wine);font-size:15px}.instruction span{font-size:13px;line-height:1.4}.stage{margin:0 -16px}canvas{display:block;width:100%;height:auto;touch-action:none;user-select:none}.notice{min-height:20px;margin:4px 0;color:var(--wine);font-size:13px;font-weight:600}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px}.footer p{font-size:12px;line-height:1.4;text-align:right;color:#704958}.panel{margin-top:12px;padding:20px;background:#fff;border-radius:24px}.panel h2{font:400 25px/1.15 Georgia,serif;margin:0 0 10px}.panel p,.panel li{font-size:14px;line-height:1.5}.panel[hidden]{display:none}.code{display:block;font-size:25px;letter-spacing:.06em;overflow-wrap:anywhere;color:var(--wine)}.muted{color:#704958;font-size:12px!important}.results{padding-left:20px}.results li{margin:4px 0}::selection{background:#E8B4B8;color:#3A1E2B}
</style></head><body><main><header class="top"><h1>Накрась ногти</h1><button class="button" id="reset">Заново</button></header><div class="status"><span id="attempt"></span><span id="supply"></span></div><div class="meter" aria-hidden="true"><i id="meter"></i></div><div class="instruction" aria-live="polite"><strong id="current"></strong><span id="hint"></span></div><div class="stage"><canvas id="game" width="390" height="560" aria-label="Игровое поле: окуните кисть в подсвеченный тюбик, проведите по его светлой кромке и покрасьте подсвеченный ноготь"></canvas></div><p class="notice" id="notice" aria-live="polite"></p><section class="panel" id="result" hidden aria-live="polite"></section><div class="footer"><button class="button" id="codesButton" aria-expanded="false" aria-controls="codes">Мои коды</button><p>Кисть находится выше пальца.<br>Ведите по ногтю её кончиком.</p></div><section class="panel" id="codes" hidden><h2>Мои коды</h2><div id="codeList"></div><p class="muted">Код проверяется в кабинете мастера. Сам по себе скриншот скидку не подтверждает.</p></section></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),paint=document.createElement('canvas'),pc=paint.getContext('2d'),mask=document.createElement('canvas'),mc=mask.getContext('2d');paint.width=mask.width=390;paint.height=mask.height=560;
const colors=['#6D1F3C','#7A3B5D','#B76E79','#E8B4B8'],names=['бордо','сливовый','пыльная роза','светло-розовый'],ys=[300,265,285,330],xs=[101,164,227,290],bx=[22,116,210,304],paths=[],masks=[];let current,step,load,wiped,painting,pointer,last,spill,empty,dropError,interrupted,drops,brush,results,attempt=1,animStart=0,finished=false,storageOk=true;
for(let i=0;i<4;i++){let y=ys[i],x=xs[i],p=new Path2D();p.moveTo(x,y);p.bezierCurveTo(x-14,y+2,x-23,y+16,x-23,y+31);p.bezierCurveTo(x-23,y+50,x-15,y+58,x,y+58);p.bezierCurveTo(x+15,y+58,x+23,y+50,x+23,y+31);p.bezierCurveTo(x+23,y+16,x+14,y+2,x,y);p.closePath();paths.push(p);mc.clearRect(0,0,390,560);mc.fill(p);let data=mc.getImageData(0,0,390,560).data,n=0;for(let j=3;j<data.length;j+=4)if(data[j]>127)n++;masks.push({data,n})}
function codes(){try{let a=JSON.parse(localStorage.getItem('nogti_game_codes')||'[]');return Array.isArray(a)?a:[]}catch(e){storageOk=false;return []}}
function update(){ $('attempt').textContent='Попытка '+attempt;$('supply').textContent='Лака на кисти: '+Math.round(load)+'%';$('meter').style.width=load+'%';$('current').textContent=finished?'Все ногти оценены':`Ноготь ${current+1} из 4 — ${names[current]}`;$('hint').textContent=finished?'Результат ниже.':step===1?'1. Коснитесь подсвеченного тюбика.':step===2?'2. Проведите кончиком кисти по светлой кромке тюбика.':'3. Одним непрерывным движением заполните ноготь.'}
function reset(add=true){if(add)attempt++;current=0;step=1;load=0;wiped=painting=spill=empty=dropError=interrupted=finished=false;pointer=last=null;drops=[];brush=null;results=[];animStart=0;pc.clearRect(0,0,390,560);$('notice').textContent='';$('result').hidden=true;update()}
function round(x,y,w,h,r,c){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=c;ctx.fill()}
function draw(time){ctx.clearRect(0,0,390,560);
// A single connected hand silhouette with four fingers and an angled thumb.
ctx.fillStyle='#f1d9d0';ctx.strokeStyle='#cda9a0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(106,560);ctx.bezierCurveTo(99,526,89,503,65,481);ctx.lineTo(28,449);ctx.bezierCurveTo(8,430,19,405,38,412);ctx.bezierCurveTo(59,420,73,439,78,444);ctx.lineTo(75,330);ctx.bezierCurveTo(75,290,127,290,127,330);ctx.lineTo(138,386);ctx.lineTo(138,295);ctx.bezierCurveTo(138,255,190,255,190,295);ctx.lineTo(201,381);ctx.lineTo(201,315);ctx.bezierCurveTo(201,275,253,275,253,315);ctx.lineTo(264,402);ctx.lineTo(264,360);ctx.bezierCurveTo(264,320,316,320,316,360);ctx.lineTo(318,450);ctx.bezierCurveTo(320,493,308,526,307,560);ctx.closePath();ctx.fill();ctx.stroke();
for(let i=0;i<4;i++){ctx.fillStyle='#faeae6';ctx.fill(paths[i])}ctx.drawImage(paint,0,0);
for(let i=0;i<4;i++){let x=bx[i];ctx.strokeStyle=i===current&&!finished?'#6D1F3C':'#bd9290';ctx.lineWidth=i===current&&!finished?3:1.5;if(i===current&&!finished){ctx.shadowColor='#B76E79';ctx.shadowBlur=12}ctx.stroke(paths[i]);ctx.shadowBlur=0;round(x,25,64,62,10,colors[i]);round(x+7,34,50,45,7,'rgba(255,255,255,.12)');round(x+13,7,38,23,5,'#3A1E2B');round(x,28,64,9,4,'#fbe6de');if(i===current&&!finished){ctx.strokeStyle='#6D1F3C';ctx.lineWidth=3;ctx.shadowColor='#B76E79';ctx.shadowBlur=10;ctx.strokeRect(x-3,4,70,86);ctx.shadowBlur=0}ctx.fillStyle=i===3?'#3A1E2B':'#fff';ctx.font='600 14px system-ui';ctx.textAlign='center';ctx.fillText(String(i+1),x+32,65);if(results[i]){ctx.fillStyle=results[i].ok?'#297344':'#a32e38';ctx.font='bold 20px system-ui';ctx.fillText(results[i].ok?'✓':'✗',xs[i],ys[i]+82);}}
if(animStart){let p=Math.min(1,(time-animStart)/500);brush={x:bx[current]+32,y:30+Math.sin(p*Math.PI)*20};if(p===1){animStart=0;step=2;load=100;update()}}let shown=brush||{x:78,y:205};ctx.save();ctx.translate(shown.x,shown.y);ctx.rotate(-.35);round(-5,-55,10,42,4,'#3A1E2B');round(-8,-20,16,9,3,'#d8b3aa');round(-10,-11,20,13,3,load?colors[Math.min(current,3)]:'#a58a86');ctx.restore();for(const d of drops){d.y+=d.v;d.v+=.15;ctx.fillStyle=d.color;ctx.beginPath();ctx.ellipse(d.x,d.y,3,5,0,0,Math.PI*2);ctx.fill()}drops=drops.filter(d=>d.y<570);requestAnimationFrame(draw)}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*390/r.width,y:(e.clientY-r.top)*560/r.height-38,rawY:(e.clientY-r.top)*560/r.height}}
function bottle(p,i){return p.x>=bx[i]&&p.x<=bx[i]+64&&p.rawY>=4&&p.rawY<=90}
function inNail(p){return ctx.isPointInPath(paths[current],p.x,p.y)}
function mark(a,b){let dist=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(dist/2));for(let i=0;i<=n;i++){let k=i/n,x=a.x+(b.x-a.x)*k,y=a.y+(b.y-a.y)*k;if(!ctx.isPointInPath(paths[current],x,y))spill=true;let spend=dist/n*.10;load=Math.max(0,load-spend);if(load<=0)empty=true;pc.fillStyle=colors[current];pc.globalAlpha=load>0?1:.25;pc.beginPath();pc.arc(x,y,22,0,Math.PI*2);pc.fill()}pc.globalAlpha=1;update()}
function coverage(){let data=pc.getImageData(0,0,390,560).data,m=masks[current],n=0;for(let i=3;i<data.length;i+=4)if(m.data[i]>127&&data[i]>=200)n++;return Math.floor(n/m.n*100)}
function showCodes(){let list=codes(),el=$('codeList');el.replaceChildren();if(!storageOk){el.textContent='Не удалось прочитать сохранённые коды.';return}if(!list.length){el.textContent='Пока нет кодов. Покрасьте хотя бы два ногтя без ошибок.';return}for(const c of list){let p=document.createElement('p'),s=document.createElement('strong');s.textContent=c.code;p.append(s,document.createTextNode(' — '+(c.superseded?'заменён':c.used?'использован':'не использован')));el.append(p)}}
function issue(n){let tier=n===4?10:n===3?7.5:5,list=codes();if(!storageOk)return null;let value=c=>Number(c.tier)||(/^NAIL10-/.test(c.code)?10:/^NAIL75-/.test(c.code)?7.5:/^NAIL05-/.test(c.code)?5:0),best=list.reduce((a,c)=>value(c)>value(a)?c:a,{});if(value(best)>=tier)return {code:best.code,existing:true,tier:value(best)};let abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',bytes=new Uint8Array(4);crypto.getRandomValues(bytes);let code=(tier===10?'NAIL10-':tier===7.5?'NAIL75-':'NAIL05-')+Array.from(bytes,b=>abc[b%abc.length]).join('');for(const c of list)if(!c.superseded)c.superseded=true;list.push({code,tier,nails:n,issuedAt:new Date().toISOString(),used:false,superseded:false});try{localStorage.setItem('nogti_game_codes',JSON.stringify(list));return {code,tier}}catch(e){storageOk=false;return null}}
function finish(){finished=true;let n=results.filter(r=>r.ok).length,p=$('result');p.hidden=false;let summary='<h2>Готово: '+n+' из 4 без ошибок</h2><ul class="results">'+results.map((r,i)=>`<li>Ноготь ${i+1}: ${r.ok?'✓ без ошибок':'✗ '+r.reason}</li>`).join('')+'</ul>';if(n>=2){let c=issue(n);summary+=c?`<p>${c.existing?'Ваш лучший код':'Ваша скидка'}: ${String(c.tier).replace('.',',')}%</p><strong class="code">${c.code}</strong><p class="muted">Код сохранён в разделе «Мои коды». Его проверяет мастер; скриншот сам по себе скидку не подтверждает.</p>`:'<p>Не удалось сохранить код. Разрешите хранение данных и попробуйте снова.</p>'}else summary+='<p>Попробуйте ещё раз.</p>';p.innerHTML=summary;if(!$('codes').hidden)showCodes();update()}
function evaluate(cancel){painting=false;if(cancel)interrupted=true;let pct=coverage(),reasons=[];if(interrupted)reasons.push('штрих прерван');if(spill)reasons.push('вылез за контур');if(dropError)reasons.push('капля');if(empty)reasons.push('лак закончился');if(!wiped)reasons.push('лишнее не убрано');if(pct<90)reasons.push('покрытие '+pct+'%');results.push({ok:!reasons.length,reason:reasons[0]||'без ошибок'});$('notice').textContent=`Ноготь ${current+1}: ${reasons.length?'✗ '+reasons.join(', '):'✓ без ошибок'}`;current++;if(current===4){finish();return}pc.save();pc.globalCompositeOperation='destination-out';pc.fill(paths[current]);pc.restore();step=1;load=0;wiped=spill=empty=dropError=interrupted=false;brush=null;update()}
canvas.addEventListener('pointerdown',e=>{if(pointer!==null||finished||animStart)return;e.preventDefault();let p=point(e),other=bx.findIndex((_,i)=>bottle(p,i));if(other>=0){if(other!==current){$('notice').textContent=`Сначала ноготь ${current+1} — тюбик ${current+1}`;return}if(step===1){animStart=performance.now();return}}pointer=e.pointerId;canvas.setPointerCapture(pointer);brush={x:p.x,y:p.y};last=p;if(step>1&&inNail(p)){painting=true;step=3;if(!wiped){dropError=true;drops.push({x:p.x,y:p.y,v:1,color:colors[current]})}mark(p,p)}else if(step>1&&p.y>240&&p.y<560){painting=true;step=3;spill=true;mark(p,p)}});
canvas.addEventListener('pointermove',e=>{if(pointer!==e.pointerId||finished)return;e.preventDefault();let p=point(e);brush={x:p.x,y:p.y};if(painting){mark(last,p)}else if(step===2&&Math.min(last.x,p.x)<=bx[current]+64&&Math.max(last.x,p.x)>=bx[current]&&Math.min(last.y,p.y)<=40&&Math.max(last.y,p.y)>=25&&Math.hypot(p.x-last.x,p.y-last.y)>4){wiped=true;load=70;step=3;$('notice').textContent='Лишнее убрано';update()}last=p});
function end(e,cancel){if(pointer!==e.pointerId)return;pointer=null;if(painting)evaluate(cancel);last=null}canvas.addEventListener('pointerup',e=>end(e,e.clientX<0||e.clientY<0||e.clientX>=innerWidth||e.clientY>=innerHeight));canvas.addEventListener('pointercancel',e=>end(e,true));canvas.addEventListener('lostpointercapture',e=>end(e,true));window.addEventListener('blur',()=>{if(pointer!==null){pointer=null;if(painting)evaluate(true)}});$('reset').onclick=()=>reset();$('codesButton').onclick=()=>{let p=$('codes');p.hidden=!p.hidden;$('codesButton').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)showCodes()};reset(false);requestAnimationFrame(draw);
})();
</script></body></html>
